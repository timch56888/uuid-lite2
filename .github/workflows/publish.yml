name: Publish to crates.io

on:
  push:
    branches: [master, beta, alpha, dev]
    paths:
      - Cargo.toml

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Idempotent: skip if this version is already on crates.io (avoids red runs for seed / no-bump pushes).
      # source-mirror bumps the patch version when writing the domain, so normal updates always have a new version and will actually publish.
      - name: Publish if version is new
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          name=$(grep -m1 '^name = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          vers=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if curl -sf "https://crates.io/api/v1/crates/$name/$vers" >/dev/null; then
            echo "::notice::$name $vers already published, skipping."
          else
            cargo publish
          fi
